    <!-- QMS 4.0 Seamless Integration Bridge Listener -->
    <script>
        (function() {
            window.addEventListener('message', function(event) {
                if (!event.data || typeof event.data !== 'object') return;
                try {
                    if (event.data.type === 'UDIP_LOAD_DATASET' && event.data.payload) {
                        if (window.UDIP && window.UDIP.DatasetSession) {
                            window.UDIP.DatasetSession.loadNewDataset(event.data.payload);
                            if (event.data.tab && window.UDIP.App) {
                                setTimeout(function() {
                                    window.UDIP.App.switchTab(event.data.tab);
                                }, 300);
                            }
                        }
                    } else if (event.data.type === 'UDIP_SWITCH_TAB' && event.data.tab) {
                        if (window.UDIP && window.UDIP.App) {
                            window.UDIP.App.switchTab(event.data.tab);
                        }
                    } else if (event.data.type === 'UDIP_SET_LANG' && event.data.lang) {
                        if (event.data.lang === 'ar') sessionStorage.setItem('udip_user_explicit_ar', '1');
                        else sessionStorage.removeItem('udip_user_explicit_ar');
                        localStorage.setItem('udip_lang', event.data.lang);
                        localStorage.setItem('udip_exec_lang', event.data.lang);
                        window.location.reload();
                    }
                } catch(e) {
                    console.error('[UDIP:BridgeListener] Error handling parent message:', e);
                }
            });
            window.addEventListener('load', function() {
                try {
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({ type: 'UDIP_READY' }, '*');
                    }
                } catch(e) {}
            });
        })();
    </script>

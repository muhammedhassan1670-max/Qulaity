<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobile-first viewport with safe area support (iPhone notch, etc.) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>QMS Enterprise 4.0</title>
    <meta name="description" content="Industrial Quality Management System — NCR, CAPA, Audits, 8D & IoT" />

    <!-- Immediate Service Worker & Cache Killer to prevent MIME and corrupt HTML errors -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            for (var i = 0; i < keys.length; i++) {
              caches.delete(keys[i]);
            }
          });
        }
        // If an active service worker is controlling the page, force one clean unregister & reload
        if (navigator.serviceWorker && navigator.serviceWorker.controller) {
          if (!sessionStorage.getItem('sw_purged_final')) {
            sessionStorage.setItem('sw_purged_final', '1');
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
              window.location.reload();
            });
          }
        }
      })();
    </script>

    <!-- Mobile Web App settings -->
    <meta name="theme-color" content="#0ea5e9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="QMS 4.0" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="QMS Enterprise 4.0" />
    <meta property="og:description" content="Industrial Quality Management System" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
